name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev zip unzip

      - name: Verify toolchain
        run: |
          arm-none-eabi-g++ --version
          arm-none-eabi-nm --version
          arm-none-eabi-readelf --version

      - name: Run native tests
        run: |
          make clean
          make unit-test

      - name: Build and inspect hardware plugin
        run: make hardware inspect

      - name: Prepare release archive
        run: |
          mkdir -p release/programs/plug-ins
          cp plugins/nt_seq.o release/programs/plug-ins/
          cd release
          zip -r ../nt_seq-plugin.zip programs
          cd ..
          unzip -l nt_seq-plugin.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nt_seq-plugin
          path: nt_seq-plugin.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nt_seq-plugin.zip
            plugins/nt_seq.o
          fail_on_unmatched_files: true
          generate_release_notes: true
